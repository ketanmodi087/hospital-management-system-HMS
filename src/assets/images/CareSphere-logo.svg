<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1769c2"/>
      <stop offset="100%" stop-color="#0b4ea2"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16a8ad"/>
      <stop offset="100%" stop-color="#07999f"/>
    </linearGradient>
  </defs>

  <!-- Transparent background; suitable for web/app usage -->

  <!-- Outer healthcare / sphere arc -->
  <path d="M 455 555
           C 365 470, 365 325, 455 245
           C 555 155, 715 150, 825 225
           C 858 248, 885 276, 907 308"
        fill="none" stroke="url(#blue)" stroke-width="22"
        stroke-linecap="round"/>

  <path d="M 905 405
           C 938 530, 904 650, 815 720
           C 720 795, 575 810, 465 748"
        fill="none" stroke="url(#blue)" stroke-width="22"
        stroke-linecap="round"/>

  <!-- Left abstract person -->
  <circle cx="500" cy="350" r="38" fill="url(#blue)"/>
  <path d="M 485 395
           C 430 425, 410 475, 422 540
           C 434 604, 480 654, 555 690
           C 515 632, 495 575, 500 525
           C 507 462, 548 414, 620 365
           C 565 382, 525 392, 485 395 Z"
        fill="url(#blue)"/>

  <!-- Right abstract person -->
  <circle cx="735" cy="365" r="38" fill="url(#teal)"/>
  <path d="M 750 410
           C 808 428, 835 474, 829 535
           C 822 604, 774 658, 680 705
           C 726 650, 746 594, 741 536
           C 735 479, 695 432, 635 391
           C 678 396, 718 401, 750 410 Z"
        fill="url(#teal)"/>

  <!-- Protective hand / base -->
  <path d="M 430 675
           C 480 645, 535 650, 585 680
           C 614 698, 649 703, 680 688
           C 702 677, 720 684, 713 698
           C 700 723, 651 735, 608 731
           C 578 728, 556 733, 565 746
           C 579 765, 630 769, 680 749
           C 727 731, 760 700, 786 670
           C 756 724, 700 772, 634 789
           C 557 809, 480 779, 430 730
           C 414 714, 413 693, 430 675 Z"
        fill="url(#blue)"/>

  <!-- Central medical cross -->
  <rect x="570" y="450" width="60" height="145" rx="7" fill="url(#teal)"/>
  <rect x="528" y="492" width="145" height="60" rx="7" fill="url(#teal)"/>

  <!-- Brand name -->
  <text x="600" y="900"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="118"
        font-weight="700"
        letter-spacing="-3">
    <tspan fill="#1769c2">Care</tspan><tspan fill="#0ba2a7">Sphere</tspan>
  </text>

  <!-- Tagline -->
  <line x1="205" y1="958" x2="285" y2="958" stroke="#0ba2a7" stroke-width="6"/>
  <line x1="915" y1="958" x2="995" y2="958" stroke="#0ba2a7" stroke-width="6"/>
  <text x="600" y="972"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="32"
        font-weight="600"
        letter-spacing="10"
        fill="#666b73">HOSPITAL MANAGEMENT</text>
</svg>
